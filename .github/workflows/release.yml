name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild an existing tag and attach (or refresh) its release assets. Needed
  # because auto-tag.yml creates tags with GITHUB_TOKEN, which never triggers
  # this workflow's tag-push event.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to (e.g. v1.6.1)'
        required: true
        type: string

permissions:
  contents: write  # create releases and upload APK + AAB assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.jks

      # APK for sideload via GitHub Releases; AAB for Play Console upload.
      # SENTRY_DSN bakes the DSN into BuildConfig so the app initialises Sentry
      # at runtime. SENTRY_AUTH_TOKEN authorises the Gradle plugin to upload
      # R8 mappings so the dashboard can de-obfuscate stack traces. Either may
      # be unset on forks/manual triggers; the build still succeeds, Sentry
      # just stays a no-op and mappings aren't uploaded.
      - name: Build release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
