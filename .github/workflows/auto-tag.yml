name: Auto Tag and Release

# Watches main for `versionName` bumps in app/build.gradle.kts. When the value
# changes vs. the previous commit, this workflow builds the signed APK and
# publishes a GitHub release at `v<versionName>`. The existing release.yml stays
# in place for manual `git tag vX.Y.Z && git push` workflows; the two don't
# collide because softprops creates the tag with GITHUB_TOKEN (which doesn't
# trigger downstream workflows).

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write  # create releases and tags

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: detect
        name: Compare versionName against previous commit
        run: |
          extract() {
            grep -oP 'versionName\s*=\s*"\K[^"]+' "$1" || true
          }
          new=$(extract app/build.gradle.kts)
          old=$(git show "HEAD^:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionName\s*=\s*"\K[^"]+' || true)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: ${old:-<none>} -> $new"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "versionName unchanged ($new); skipping release."
          fi

      - id: check-tag
        if: steps.detect.outputs.changed == 'true'
        name: Skip if tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.detect.outputs.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; aborting to avoid overwriting an existing release."
            exit 1
          fi

  release:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.jks

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-bump.outputs.version }}
          name: v${{ needs.detect-version-bump.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
