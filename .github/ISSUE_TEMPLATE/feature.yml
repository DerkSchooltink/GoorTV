name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case before the solution. "I want to X because Y."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. What would the feature look like in the UI / behaviour?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Workarounds you've tried or other apps that handle this differently.
