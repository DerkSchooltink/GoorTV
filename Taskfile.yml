version: '3'

tasks:
  build:
    desc: Assemble debug APK
    cmd: ./gradlew assembleDebug

  build:release:
    desc: Assemble release APK
    cmd: ./gradlew assembleRelease

  bundle:release:
    desc: Build release AAB (Play Store upload artifact)
    cmd: ./gradlew :app:bundleRelease

  install:
    desc: Install debug APK on connected device
    cmd: ./gradlew installDebug

  run:
    desc: Install and launch app
    cmds:
      - ./gradlew installDebug
      - adb shell am start -n dev.goor.tv/.MainActivity

  test:
    desc: Run unit + instrumented tests
    cmds:
      - task: test:unit
      - task: test:ui

  test:unit:
    desc: Run JVM unit tests
    cmd: ./gradlew :app:testDebugUnitTest

  test:ui:
    desc: Run instrumented Compose UI tests (needs device/emulator)
    cmd: ./gradlew :app:connectedDebugAndroidTest

  maestro:
    desc: Run all Maestro E2E flows
    cmd: maestro test .maestro/

  maestro:flow:
    desc: Run a single Maestro flow (task maestro:flow -- 01_empty_state.yaml)
    cmd: maestro test .maestro/{{.CLI_ARGS}}

  benchmark:
    desc: Run scroll benchmark on connected device (needs benchmark build type)
    cmd: ANDROID_SERIAL=$(adb devices | grep -v "List of" | head -1 | cut -f1) ./gradlew :benchmark:connectedBenchmarkAndroidTest

  profile:
    desc: Capture gfxinfo frame stats (scroll the app during the 8s window)
    vars:
      DEVICE:
        sh: adb devices | grep -v "List of devices" | grep -v "(" | grep "device$" | head -1 | cut -f1
    cmds:
      - adb -s {{.DEVICE}} shell dumpsys gfxinfo dev.goor.tv reset
      - echo ">>> Scroll the app now — capturing for 8 seconds..."
      - sleep 8
      - adb -s {{.DEVICE}} shell dumpsys gfxinfo dev.goor.tv framestats

  lint:
    desc: Run Android lint
    cmd: ./gradlew :app:lint

  logcat:
    desc: Filtered logcat for GoorTV
    cmd: adb logcat -s GoorTV:V AndroidRuntime:E

  clean:
    desc: Clean build artifacts
    cmd: ./gradlew clean
